name: Build Check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v6
        with:
          submodules: recursive
          # Fresh generator tests extract the pinned baseline from git history.
          fetch-depth: 0
      - name: Install dependencies
        run: brew install cmake libomp rust
      - name: Set up Ruby (for xcpretty)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Install xcpretty
        run: gem install xcpretty
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Worker tooling
        run: npm ci
      - name: Verify in-place generation and offline regression tests
        run: |
          python3 scripts/patch_osw.py
          git diff --exit-code
          npm test
          scripts/test_shortcuts.sh
      - name: Build OSW Cloud candidate without installation
        run: scripts/build_app.sh
      - name: Verify candidate signature
        run: codesign --verify --deep --strict build/Build/Products/Release/OpenSuperWhisper.app
